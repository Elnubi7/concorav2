services:
  api:
    build: .
    extra_hosts:
     - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: ${APP_ENV}
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_MODELS_BASE_URL: ${GITHUB_MODELS_BASE_URL}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE}
      SIMPLE_CHAT_MODE: ${SIMPLE_CHAT_MODE}
      HYBRID_ROUTER_MODE: ${HYBRID_ROUTER_MODE}
      COMPLEXITY_THRESHOLD: ${COMPLEXITY_THRESHOLD}
      ENABLE_RAG: ${ENABLE_RAG}
      ENABLE_RESOURCE_RAG: ${ENABLE_RESOURCE_RAG}
      ENABLE_MEMORY: ${ENABLE_MEMORY}
      ENABLE_LANGGRAPH: ${ENABLE_LANGGRAPH}
      ENABLE_DB: ${ENABLE_DB}
      ENABLE_REDIS: ${ENABLE_REDIS}
      ALWAYS_FAST_CHAT: ${ALWAYS_FAST_CHAT}
      LLM_FAST_MAX_TOKENS: ${LLM_FAST_MAX_TOKENS}
      LLM_FAST_TEMPERATURE: ${LLM_FAST_TEMPERATURE}
      LLM_FAST_TIMEOUT_SECONDS: ${LLM_FAST_TIMEOUT_SECONDS}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      VECTOR_BACKEND: ${VECTOR_BACKEND}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
      LOG_LEVEL: ${LOG_LEVEL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE}
      RAG_TOP_K: ${RAG_TOP_K}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP}
      RAG_MAX_DOCUMENT_SIZE: ${RAG_MAX_DOCUMENT_SIZE}
      RESOURCE_RAG_MAX_DEFAULT: ${RESOURCE_RAG_MAX_DEFAULT}
      RESOURCE_RAG_MAX_EXPLICIT: ${RESOURCE_RAG_MAX_EXPLICIT}
      RESOURCE_RAG_STRONG_MATCH_THRESHOLD: ${RESOURCE_RAG_STRONG_MATCH_THRESHOLD}
      RESOURCE_RAG_PERMISSION_THRESHOLD: ${RESOURCE_RAG_PERMISSION_THRESHOLD}
      RESOURCE_RAG_MIN_TURNS_BEFORE_SUGGEST: ${RESOURCE_RAG_MIN_TURNS_BEFORE_SUGGEST}
      RESOURCE_RAG_MIN_DEPTH_BEFORE_RECOMMEND: ${RESOURCE_RAG_MIN_DEPTH_BEFORE_RECOMMEND}
      RESOURCE_RAG_COOLDOWN_TURNS: ${RESOURCE_RAG_COOLDOWN_TURNS}
      RESOURCE_INTENT_CLASSIFIER: ${RESOURCE_INTENT_CLASSIFIER}
      RESOURCE_INTENT_CLASSIFIER_MODEL: ${RESOURCE_INTENT_CLASSIFIER_MODEL}
      RESOURCE_INTENT_CONFIDENCE_THRESHOLD: ${RESOURCE_INTENT_CONFIDENCE_THRESHOLD}
      MEMORY_ENABLED: ${MEMORY_ENABLED}
      STREAMING_ENABLED: ${STREAMING_ENABLED}
      ALLOW_WILDCARD_CORS: ${ALLOW_WILDCARD_CORS}
      ALLOW_PLACEHOLDER_LOCAL_API_KEYS: ${ALLOW_PLACEHOLDER_LOCAL_API_KEYS:-false}
      ARCHIVE_DELETED_SESSIONS: ${ARCHIVE_DELETED_SESSIONS}
      METRICS_TOKEN: ${METRICS_TOKEN}
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - .:/app
    command: >
      sh -c 'if [ "$${SIMPLE_CHAT_MODE}" = "true" ] &&
      [ "$${ENABLE_DB}" != "true" ] &&
      [ "$${ENABLE_RAG}" != "true" ] &&
      [ "$${ENABLE_MEMORY}" != "true" ] &&
      [ "$${ENABLE_REDIS}" != "true" ];
      then uvicorn app.main:app --host "$${API_HOST}" --port "$${API_PORT}" --reload;
      else alembic upgrade head && uvicorn app.main:app --host "$${API_HOST}" --port "$${API_PORT}" --reload;
      fi'

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  postgres_data:
